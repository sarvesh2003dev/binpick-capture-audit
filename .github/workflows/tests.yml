name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  customer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-customer.txt
      - run: python -m unittest discover -s customer_audit/tests -v

  dimo-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
        working-directory: experiments/dimo
      - run: python -m unittest discover -s . -p 'test_*.py' -v
        working-directory: experiments/dimo

  procedural-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s . -p 'test_*.py' -v
        working-directory: experimental/isaac
